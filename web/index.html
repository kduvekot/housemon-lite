<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>housemon-lite</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header>
    <h1>housemon<span>-lite</span></h1>
    <p id="status" class="status">connecting…</p>
  </header>

  <main>
    <section class="tiles">
      <div class="tile"><h2>Grid</h2><p><span id="tile-grid" class="big">–</span> W</p><small id="tile-grid-note">from P1</small></div>
      <div class="tile"><h2>House</h2><p><span id="tile-house" class="big">–</span> W</p><small>from S0</small></div>
      <div class="tile"><h2>Solar</h2><p><span id="tile-solar" class="big">–</span> W</p><small>from S0</small></div>
    </section>

    <section class="card">
      <h2 id="s0-title">S0 meters</h2>
      <p class="age" id="s0-age">waiting for data…</p>
      <table id="s0"><thead><tr><th>Channel</th><th class="num">Power</th><th class="num">Counter</th><th title="when this page last saw the counter change">Last pulse seen</th></tr></thead><tbody></tbody></table>
    </section>

    <section class="card">
      <h2 id="p1-title">Smart meter</h2>
      <p class="age" id="p1-age">waiting for data…</p>
      <table id="p1"><thead><tr><th>Reading</th><th class="num">Value</th><th>Unit</th></tr></thead><tbody></tbody></table>
    </section>
  </main>

  <footer>Values light up briefly when they change. Raw data stays on the Pi; this page decodes it.</footer>
</body>
</html>
